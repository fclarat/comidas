<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Comidas Familiares</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>🍱 Menú Familiar</h1>
            <p>Planificación mensual adaptable para Alma y adultos</p>
        </header>

        <section class="rules-banner">
            <ul id="rules-list" class="rules-list">
                <!-- Reglas cargadas desde JSON -->
            </ul>
        </section>

        <div class="controls">
            <div class="sync-info">
                <span id="save-status" class="save-status">✓ Local</span>
                <span id="cloud-status" class="cloud-status">☁️ Desconectado</span>
            </div>
            <button class="secondary" id="share-btn">🔗 Compartir link</button>
            <button class="secondary" id="reset-btn">🔄 Resetear</button>
            <button class="secondary" id="copy-btn">📋 Copiar JSON</button>
            <button class="secondary" id="import-btn">📥 Importar</button>
            <button id="export-btn">📤 Descargar</button>
            <input type="file" id="file-input" style="display: none;" accept=".json">
        </div>

        <main id="calendar-container" class="calendar-grid">
            <!-- Semanas cargadas dinámicamente -->
        </main>

        <section class="backups-section">
            <h2>🆘 Planes B (Rápidos)</h2>
            <div id="backups-list" class="backups-list">
                <!-- Planes B cargados desde JSON -->
            </div>
        </section>

        <footer>
            <p>Hecho con amor por Facu ❤️ para que Alma coma más sano 👧 - v<span id="app-version">0.0.0</span></p>
        </footer>
    </div>

    <!-- Modal para Edición -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Editar Comida</h2>
                <button class="close-btn" id="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <label for="edit-input"
                    style="display:block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600;">Comida:</label>
                <textarea id="edit-input" rows="4" style="margin-bottom: 1rem;"></textarea>

                <label for="edit-link"
                    style="display:block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600;">Link de Receta
                    (opcional):</label>
                <input type="url" id="edit-link" placeholder="https://ejemplo.com/receta"
                    style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--bg-main);">
            </div>
            <div class="modal-footer">
                <button class="secondary" id="modal-cancel" onclick="closeModal()">Cancelar</button>
                <button id="modal-save" onclick="saveModal()">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
